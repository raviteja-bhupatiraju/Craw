[package]
name = "craw"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky = { version = "0.13.0" }
tower-lsp = "0.20.0"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
syn = { version = "3.0.4", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
rustyline = "18.0.1"
parking_lot = "0.12.5"
home = "0.5.12"
rustyline-derive = "0.12.0"

[lib]
name = "craw"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
