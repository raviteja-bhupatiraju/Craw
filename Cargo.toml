[package]
name = "craw"
version = "0.1.0"
edition = "2024"

[dependencies]
# `stacker` (chumsky's default deep-recursion feature) pulls in `psm`,
# which builds hand-written stack-switching assembly - unnecessary
# native-code surface we don't need. Disabling it trades graceful
# handling of pathologically deep recursion for a simpler build.
chumsky = { version = "0.13.0", default-features = false, features = ["std"] }
tower-lsp = "0.20.0"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
syn = { version = "3.0.4", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
rustyline = "18.0.1"
parking_lot = "0.12.5"
home = "0.5.12"
rustyline-derive = "0.12.0"

[lib]
name = "craw"
path = "src/lib.rs"

[profile.release]
opt-level = 3
# LTO (fat or thin) merges the whole dependency graph - including
# chumsky's deeply-generic recursive parser combinator types - into one
# LLVM module for cross-crate optimization. Codegen for that merged
# module overflows rustc's own compilation-thread stack (confirmed via
# a reproducible SIGSEGV inside LLVM's SelectionDAG instruction
# selection, not specific to any one platform or toolchain), so it's
# off entirely rather than merely switched between LTO modes.
lto = false
codegen-units = 1
panic = "abort"
strip = true
