[package]
name = "craw"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky = { version = "0.12.0" }
tower-lsp = "0.20.0"
tokio = { version = "1.34", features = ["full"] }
serde_json = "1.0.149"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
rustyline = "17.0.2"
parking_lot = "0.12.5"
home = "0.5.12"
rustyline-derive = "0.11.1"

[lib]
name = "craw"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
