filetype: craw

detect:
    filename: "\\.craw$"

rules:
    # Comments
    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME):?"

    # Keywords - Control Flow & Declarations
    - statement: "\\b(def|return|if|else|then|match|case|cases|for|in|yield|async|await|where|global|nonlocal|class|import|from|as|try|except|finally|raise|del|with|assert|pass|type|operator|lambda)\\b"
    - statement: "\\b(data|copyclosure|addpattern)\\b"
    - constant.bool: "\\b(True|False|None)\\b"
    - statement: "\\b(is|not|and|or)\\b"

    # Unicode Symbols
    - special: "[λ∘∩∪≠≤≥⇒→↦…⏨]"

    # Operators - Pipes and Composition
    - symbol.operator: "(\\|>|<\\||\\|\\*>|\\|\\*\\*>|\\|\\?>|\\|\\?\\*>|\\|\\?\\*\\*>|<\\*\\||<\\*\\*\\||<\\?\\||<\\*\\?\\||<\\*\\*\\?\\|)"
    - symbol.operator: "(\\.\\.|\\.\\.>|\\.\\.\\*>|\\.\\.\\*\\*>|\\.\\.\\?>|<\\.\\.|<\\*\\.\\.|<\\*\\*\\.\\.)"
    - symbol.operator: "(=>|->|\\?\\?|\\$|::|&:|//|\\*\\*)"
    - symbol.operator: "([-+/*=<>!~%&|^]|:=)"

    # Attributes and Numbers
    - symbol: "\\.[a-zA-Z_][a-zA-Z0-9_]*"
    - constant.number: "\\b([0-9]+[a-zA-Z_][a-zA-Z0-9_]*)\\b" # Coefficients
    - constant.number: "\\b(0x[0-9a-fA-F]+|0b[01]+|0o[0-7]+)\\b"
    - constant.number: "\\b([0-9]+\\.[0-9]*([eE][-+]?[0-9]+)?|[0-9]+[eE][-+]?[0-9]+)\\b" # Floats
    - constant.number: "\\b([0-9]+([iIjJ]))\\b" # Imaginary
    - constant.number: "\\b([0-9]+)\\b"

    # Passthrough
    - preproc: "\\\\\\\\" # Line passthrough
    - preproc: "\\\\\\("  # Inline passthrough start
    - preproc: "\\)"      # Inline passthrough end

    # Brackets and Punctuation
    - symbol.brackets: "(\\(\\||\\|\\))" # Lazy list literals (| |)
    - symbol.brackets: "(\\{|\\})"
    - symbol.brackets: "(\\(|\\))"
    - symbol.brackets: "(\\[|\\])"
    - symbol.brackets: "\\b[smf]\\{" # Set/Multiset/Frozenset literals
    - symbol: "(:|,|;)"
    - symbol: "`" # Infix functions

    # Strings
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\[abfnrtv'\\\"\\\\]"
    - constant.string:
        start: "'"
        end: "'"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\[abfnrtv'\\\"\\\\]"
